<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YZY Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Loading YZY Archive…</div>
  </div>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="logo">YZY Archive</div>
    <button id="themeToggle" class="theme-toggle">🌙</button>
  </header>

  <!-- Search Bar -->
  <input type="text" id="searchInput" placeholder="Search YZY Archive..." class="search-bar">

  <!-- File Grid -->
  <main class="file-grid" id="fileGrid"></main>

  <!-- Audio Player Modal -->
  <div class="modal" id="audioModal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h2 id="trackTitle"></h2>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
